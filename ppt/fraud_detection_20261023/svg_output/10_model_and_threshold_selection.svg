<g id="title" data-pptx-bounds="64 48 1152 94" fill="#F5F5F5"><text x="64" y="70" font-size="16" fill="#A7ABB2">06  VALIDATION</text><text x="64" y="124" font-size="44">Model selection and threshold selection</text></g>
<g id="selection-sequence" data-pptx-bounds="64 200 1152 295" fill="#F5F5F5"><text x="64" y="245" font-size="44">01</text><text x="200" y="242" font-size="30">Fit every candidate on fit rows</text><text x="200" y="283" font-size="23" fill="#A7ABB2">Each candidate gets its own calibration F1-maximizing threshold.</text><text x="64" y="347" font-size="44">02</text><text x="200" y="344" font-size="30">Compare calibration AP</text><text x="200" y="385" font-size="23" fill="#A7ABB2">Tie-break by calibration F1, then fewer input features.</text><text x="64" y="449" font-size="44">03</text><text x="200" y="446" font-size="30">Freeze the operating policy</text><text x="200" y="487" font-size="23" fill="#A7ABB2">Evaluate internally, then refit on all training data for final inference.</text></g>
<g id="score-interpretation" data-pptx-bounds="64 548 1152 79" fill="#D0D2D6"><line x1="64" y1="549" x2="1216" y2="549" stroke="#36383D"/><text x="64" y="588" font-size="23">A score cutoff of 0.9993 does not imply a calibrated 99.93% fraud probability.</text><text x="64" y="619" font-size="20" fill="#A7ABB2">Repeated calibration use and full-file EDA can make internal estimates optimistic.</text></g>
